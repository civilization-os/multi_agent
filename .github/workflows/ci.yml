name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Resolve dependencies (with fallback)
        run: |
          if ! npm view @civilization/model-core version > /dev/null 2>&1; then
            echo "Package @civilization/model-core is not yet published on npm registry."
            echo "Cloning and building @civilization/model-core from GitHub..."
            git clone --depth 1 https://github.com/civilization-os/model_core.git ../model_core
            cd ../model_core
            npm install
            npm run build
            cd ../multi_agent
            node -e "const pkg = require('./package.json'); pkg.dependencies['@civilization/model-core'] = 'file:../model_core'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"
            npm install
          else
            echo "Found @civilization/model-core on npm registry."
            npm ci || npm install
          fi

      - name: Type Check & Build
        run: npm run build

      - name: Run Test Suite
        run: npm test
